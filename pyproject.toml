[project]
name = "grounded-rag"
version = "0.1.0"
description = "Assistente RAG local e avaliado: respostas fundamentadas em documentos, com citações de fonte e página."
readme = "README.md"
authors = [
    { name = "Piero Volpato", email = "pierobvdev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.0",
    "pymupdf>=1.28.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[project.scripts]
grounded-rag = "grounded_rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# data/ contém o corpus: o ruff formata blocos de código dentro de .md e alteraria
# os documentos originais (quebrando os hashes do MANIFEST.json).
extend-exclude = ["data"]

[tool.ruff.lint]
# E/F: erros básicos (pyflakes, pycodestyle); I: ordem de imports;
# B: bugs comuns (bugbear); UP: sintaxe moderna; SIM: simplificações.
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Testes que usam modelos reais ficam fora por padrão (o CI não tem modelo).
# Para rodá-los localmente: uv run pytest -m ollama  /  uv run pytest -m models
addopts = "-m 'not ollama and not models'"
markers = [
    "ollama: precisa de um Ollama rodando em OLLAMA_BASE_URL",
    "models: baixa e roda modelos locais (ex.: cross-encoder do Hugging Face)",
]
# Aviso interno do pymupdf (bindings SWIG), sem relação com o nosso código.
filterwarnings = ["ignore:builtin type (SwigPy|swigvarlink).*:DeprecationWarning"]

# PyTorch (dependência do sentence-transformers): no Linux, usa o índice CPU-only do PyTorch.
# O pacote padrão do PyPI para Linux traz CUDA (vários GB) e deixaria o CI lento.
# No macOS continua o pacote normal do PyPI, que usa a GPU do Mac (MPS).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
